<script>
(function () {
  const carousel = document.getElementById('portfolioCarousel');
  if (!carousel) return;

  const track = carousel.querySelector('.carousel-track');
  const slides = Array.from(carousel.querySelectorAll('.carousel-slide'));
  const prev = carousel.querySelector('.carousel-prev');
  const next = carousel.querySelector('.carousel-next');
  const dotsContainer = carousel.querySelector('.carousel-dots');

  let current = 0;
  const slideCount = slides.length;
  const autoplayDelay = 3500;
  let autoplayId = null;

  dotsContainer.innerHTML = '';
  slides.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'carousel-dot';
    btn.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    btn.addEventListener('click', () => goTo(i));
    dotsContainer.appendChild(btn);
  });

  const dots = Array.from(dotsContainer.children);

  function sizeSlides() {
    const w = carousel.clientWidth;
    slides.forEach(s => {
      s.style.minWidth = w + 'px';
      s.style.maxWidth = w + 'px';
    });
  }

  function update() {
    const currentSlide = slides[current];
    const carouselW = carousel.clientWidth;
    const slideW = currentSlide.getBoundingClientRect().width;
    const desiredLeft = Math.round((carouselW - slideW) / 2);
    const offsetPx = Math.round(desiredLeft - currentSlide.offsetLeft);
    track.style.transform = `translateX(${offsetPx}px)`;

    slides.forEach((s, i) => s.setAttribute('aria-hidden', i === current ? 'false' : 'true'));
    dots.forEach((d, i) => d.classList.toggle('is-active', i === current));
  }

  function goTo(index) {
    current = (index + slideCount) % slideCount;
    update();
    restartAutoplay();
  }

  function nextSlide() { goTo(current + 1); }
  function prevSlide() { goTo(current - 1); }

  next.addEventListener('click', nextSlide);
  prev.addEventListener('click', prevSlide);

  function startAutoplay() {
    if (autoplayId) return;
    autoplayId = setInterval(nextSlide, autoplayDelay);
  }

  function stopAutoplay() {
    if (!autoplayId) return;
    clearInterval(autoplayId);
    autoplayId = null;
  }

  function restartAutoplay() { stopAutoplay(); startAutoplay(); }

  carousel.addEventListener('mouseenter', stopAutoplay);
  carousel.addEventListener('focusin', stopAutoplay);
  carousel.addEventListener('mouseleave', startAutoplay);
  carousel.addEventListener('focusout', startAutoplay);

  let startX = null;
  track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; stopAutoplay(); });
  track.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) dx < 0 ? nextSlide() : prevSlide();
    startX = null; startAutoplay();
  });

  carousel.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevSlide();
    if (e.key === 'ArrowRight') nextSlide();
  });

  window.addEventListener('resize', () => {
    sizeSlides();
    requestAnimationFrame(update);
  });

  sizeSlides();
  update();
  startAutoplay();
})();
</script>
