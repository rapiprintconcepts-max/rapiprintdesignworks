<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: 'Rapiprint Design Works creates bold, precision-engineered prototypes, custom parts, and studio tools in South-Central Iowa.' }}">
    <meta name="theme-color" content="#0d1b2a">
    <meta property="og:title" content="{{ page.title | default: 'Rapiprint Design Works' }} | Rapiprint Design Works">
    <meta property="og:description" content="{{ page.description | default: 'Bold ideas. Built precisely.' }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rapiprintdesignworks.com{{ page.url }}">
    <link rel="canonical" href="https://rapiprintdesignworks.com{{ page.url }}">
    <title>{{ page.title | default: 'Rapiprint Design Works' }} | Rapiprint Design Works</title>
    <!-- Cache-bust stylesheet on every deploy so visitors always get the latest CSS -->
    <link rel="stylesheet" href="/assets/style.css?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
    <!-- carousel-fix.css removed — consolidated into /assets/style.css to avoid caching conflicts -->
</head>
<body>
    {% include header.html %}
    <main>{{ content }}</main>
    <footer class="footer">
        <div class="container footer-inner">
            <p><strong>Rapiprint Design Works LLC</strong></p>
            <p>Bold ideas. Built precisely. &middot; South-Central Iowa</p>
            <p><a href="mailto:admin@rapiprintdesignworks.com">admin@rapiprintdesignworks.com</a></p>
        </div>
    </footer>

    <div id="gallery-modal" class="gallery-modal" aria-hidden="true">
        <button type="button" class="gallery-modal-close" aria-label="Close image">×</button>
        <div class="gallery-modal-content">
            <img src="" alt="Expanded gallery image">
            <p class="gallery-modal-caption"></p>
        </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const modal = document.getElementById('gallery-modal');
        if (!modal) return;

        const modalImage = modal.querySelector('img');
        const modalCaption = modal.querySelector('.gallery-modal-caption');
        const closeButton = modal.querySelector('.gallery-modal-close');

        document.querySelectorAll('[data-lightbox]').forEach(function (link) {
          link.addEventListener('click', function (event) {
            event.preventDefault();
            modalImage.src = this.href;
            modalCaption.textContent = this.dataset.title || this.querySelector('img')?.alt || 'Project image';
            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
          });
        });

        function closeModal() {
          modal.classList.remove('is-open');
          modal.setAttribute('aria-hidden', 'true');
        }

        closeButton.addEventListener('click', closeModal);
        modal.addEventListener('click', function (event) {
          if (event.target === modal) closeModal();
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
        });
      });
    </script>
</body>
</html>
